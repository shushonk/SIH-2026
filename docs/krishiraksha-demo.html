<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KrishiRaksha — Demo Walkthrough</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4ED;
    --paper-raised:#FFFFFF;
    --ink:#1E2420;
    --ink-soft:#54605A;
    --green:#24463B;
    --green-soft:#E4EBE6;
    --turmeric:#C68A2E;
    --turmeric-soft:#F6E9D2;
    --rust:#B5432D;
    --rust-soft:#F5E2DC;
    --sage:#7C9483;
    --line:#DAD4C4;
    --shadow: 0 1px 0 rgba(30,36,32,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:36px 28px 64px;
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:22px;
    margin-bottom:32px;
    gap:24px;
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2.1rem;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .brand p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.95rem;
    max-width:520px;
    line-height:1.5;
  }
  .loop-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--green);
    background:var(--green-soft);
    border:1px solid var(--green);
    padding:6px 10px;
    border-radius:3px;
    white-space:nowrap;
  }
  .layout{
    display:grid;
    grid-template-columns:260px 1fr;
    gap:32px;
  }
  @media (max-width: 860px){
    .layout{grid-template-columns:1fr;}
  }
  .rail{
    border-right:1px solid var(--line);
    padding-right:24px;
  }
  @media (max-width: 860px){
    .rail{border-right:none;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:20px;}
  }
  .step-btn{
    display:flex;
    gap:12px;
    align-items:flex-start;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    cursor:pointer;
    padding:11px 8px;
    border-radius:4px;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink-soft);
    position:relative;
  }
  .step-btn:hover{background:rgba(36,70,59,0.06);}
  .step-btn.active{
    background:var(--green);
    color:#fff;
  }
  .step-btn.active .step-num{color:#fff; border-color:rgba(255,255,255,0.5);}
  .step-btn.active .step-role{color:var(--turmeric-soft);}
  .step-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    width:22px;
    height:22px;
    flex:0 0 22px;
    border:1px solid var(--line);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .step-label{font-size:0.88rem; font-weight:500; line-height:1.35;}
  .step-role{
    display:block;
    font-size:0.7rem;
    color:var(--sage);
    margin-top:2px;
    font-family:'IBM Plex Mono', monospace;
  }
  .stage{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    padding:28px 30px 30px;
    min-height:520px;
    box-shadow:var(--shadow);
  }
  .stage-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:6px;
  }
  .stage-head h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.5rem;
    margin:0;
  }
  .role-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    padding:5px 10px;
    border-radius:3px;
    white-space:nowrap;
    margin-top:3px;
  }
  .role-Farmer{background:var(--turmeric-soft); color:#7A5210; border:1px solid var(--turmeric);}
  .role-Expert{background:var(--green-soft); color:var(--green); border:1px solid var(--green);}
  .role-Officer{background:var(--rust-soft); color:var(--rust); border:1px solid var(--rust);}
  .role-System{background:#EDEBE3; color:var(--ink-soft); border:1px solid var(--line);}
  .stage-note{
    color:var(--ink-soft);
    font-size:0.94rem;
    line-height:1.55;
    max-width:640px;
    margin:10px 0 22px;
  }
  .mock{
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px 22px;
    background:#FCFBF7;
  }
  .mock h3{
    font-size:0.78rem;
    text-transform:none;
    color:var(--ink-soft);
    margin:0 0 14px;
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.01em;
  }
  .diag-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:0.92rem;
  }
  .diag-row:last-child{border-bottom:none;}
  .diag-row .pct{font-family:'IBM Plex Mono', monospace; color:var(--ink-soft);}
  .badge{
    display:inline-block;
    padding:3px 9px;
    border-radius:3px;
    font-size:0.74rem;
    font-family:'IBM Plex Mono', monospace;
  }
  .badge.moderate{background:var(--turmeric-soft); color:#7A5210;}
  .badge.high{background:var(--rust-soft); color:var(--rust);}
  .badge.low{background:var(--green-soft); color:var(--green);}
  .action-request{
    margin-top:16px;
    padding:14px 16px;
    background:var(--turmeric-soft);
    border-left:3px solid var(--turmeric);
    border-radius:3px;
    font-size:0.9rem;
  }
  .risk-score{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:14px;
  }
  .risk-score .num{
    font-family:'Fraunces', serif;
    font-size:2.4rem;
    font-weight:600;
    color:var(--rust);
  }
  .factor-list{list-style:none; margin:0; padding:0;}
  .factor-list li{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px solid var(--line);
    font-size:0.88rem;
  }
  .factor-list li:last-child{border-bottom:none;}
  .factor-list .weight{font-family:'IBM Plex Mono', monospace; color:var(--rust);}
  .queue-item{
    border:1px solid var(--line);
    border-radius:5px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .queue-item.top{border-color:var(--rust); background:var(--rust-soft);}
  .queue-item .field-name{font-weight:600; font-size:0.94rem;}
  .queue-item .reasons{font-size:0.8rem; color:var(--ink-soft); margin-top:3px;}
  .queue-item .score{font-family:'IBM Plex Mono', monospace; font-size:1.1rem; font-weight:600;}
  .queue-item.top .score{color:var(--rust);}
  .compare-cols{display:flex; gap:20px;}
  .compare-col{flex:1; padding:14px 16px; border:1px solid var(--line); border-radius:5px;}
  .compare-col h4{margin:0 0 8px; font-size:0.8rem; font-family:'IBM Plex Mono', monospace; color:var(--ink-soft);}
  .compare-col .val{font-family:'Fraunces', serif; font-size:1.8rem; font-weight:600;}
  .compare-col.improve .val{color:var(--green);}
  .compare-col.before .val{color:var(--ink-soft);}
  .footnote{
    margin-top:20px;
    font-size:0.8rem;
    color:var(--sage);
    font-style:italic;
  }
  .nav-buttons{
    display:flex;
    justify-content:space-between;
    margin-top:26px;
  }
  .nav-btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:0.88rem;
    padding:10px 20px;
    border-radius:4px;
    border:1px solid var(--green);
    background:var(--green);
    color:#fff;
    cursor:pointer;
  }
  .nav-btn.secondary{
    background:none;
    color:var(--green);
  }
  .nav-btn:disabled{
    opacity:0.35;
    cursor:default;
  }
  .expert-note{
    margin-top:16px;
    padding:14px 16px;
    background:var(--green-soft);
    border-left:3px solid var(--green);
    border-radius:3px;
    font-size:0.9rem;
  }
  .field-list{display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:0.88rem; margin-top:4px;}
  .field-list div span{color:var(--ink-soft); display:block; font-size:0.75rem; font-family:'IBM Plex Mono', monospace;}
  .chat-msg{
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
    margin-bottom:14px;
    background:#FCFBF7;
  }
  .chat-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
  }
  .chat-farmer{font-weight:600; font-size:0.9rem;}
  .delivery-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    padding:4px 9px;
    border-radius:12px;
  }
  .delivery-badge.online{background:var(--green-soft); color:var(--green);}
  .delivery-badge.mesh{background:var(--turmeric-soft); color:#7A5210;}
  .chat-bubble{
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 13px;
    font-size:0.88rem;
    margin-bottom:8px;
    line-height:1.5;
  }
  .chat-bubble.cure{
    background:var(--green-soft);
    border-color:var(--green);
  }
  .mesh-path{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
    background:#F1EFE6;
    border-radius:4px;
    padding:8px 10px;
    margin-top:4px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>KrishiRaksha</h1>
      <p>Closed-loop agricultural decision support — demo walkthrough of a single field, start to finish.</p>
    </div>
    <div class="loop-tag">OBSERVE → INVESTIGATE → VERIFY → ASSESS → PRIORITIZE → ACT → MONITOR → LEARN</div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <section class="stage" id="stage"></section>
  </div>
</div>

<script>
const stages = [
  {
    role: "Farmer",
    label: "Farmer uploads leaf image",
    title: "Observation captured",
    note: "Farmer photographs a tomato leaf showing early spotting and uploads it from the field. Crop, variety, and field ID are already on file from a previous cycle.",
    render: () => `
      <div class="mock">
        <h3>FARMER APP — FIELD 104, TOMATO (PUSA RUBY)</h3>
        <div style="display:flex; gap:20px; align-items:center;">
          <div style="width:120px;height:120px;background:linear-gradient(135deg,#88a878,#5c7a4f);border-radius:6px;flex:0 0 120px;"></div>
          <div>
            <div style="font-weight:600; margin-bottom:4px;">leaf_scan_0148.jpg</div>
            <div style="font-size:0.85rem; color:var(--ink-soft);">Captured 6:42 AM · Field 104 · Growth stage: Flowering</div>
          </div>
        </div>
      </div>`
  },
  {
    role: "System",
    label: "AI gives moderate-confidence result",
    title: "Initial analysis — uncertain",
    note: "The vision model returns a differential diagnosis rather than a single confident label. It refuses to overclaim a diagnosis from one image alone.",
    render: () => `
      <div class="mock">
        <h3>AI ANALYSIS</h3>
        <div class="diag-row"><span>Early Blight (Alternaria solani)</span><span class="pct">52%</span></div>
        <div class="diag-row"><span>Septoria Leaf Spot</span><span class="pct">31%</span></div>
        <div class="diag-row"><span>Nutrient deficiency (Potassium)</span><span class="pct">17%</span></div>
        <div style="margin-top:14px;"><span class="badge moderate">Confidence: Moderate</span> &nbsp; <span class="badge moderate">Severity: Medium (est.)</span></div>
      </div>`
  },
  {
    role: "System",
    label: "Investigation engine asks for more evidence",
    title: "Differential diagnosis is too close to call",
    note: "Rather than guessing, the system identifies exactly what evidence would separate the two leading candidates and asks for it.",
    render: () => `
      <div class="mock">
        <h3>INVESTIGATION REQUEST</h3>
        <p style="font-size:0.9rem; margin:0 0 10px;">Early Blight and Septoria Leaf Spot look similar from the top of the leaf. The underside pattern is the key differentiator.</p>
        <div class="action-request">Next step: Please upload a close-up photo of the <b>leaf underside</b>.</div>
      </div>`
  },
  {
    role: "Farmer",
    label: "Farmer uploads leaf underside",
    title: "Second observation captured",
    note: "Farmer follows the prompt and uploads the requested close-up — no technical knowledge required, just following a clear instruction.",
    render: () => `
      <div class="mock">
        <h3>FARMER APP — FOLLOW-UP CAPTURE</h3>
        <div style="display:flex; gap:20px; align-items:center;">
          <div style="width:120px;height:120px;background:linear-gradient(135deg,#7a9468,#465c3d);border-radius:6px;flex:0 0 120px;"></div>
          <div>
            <div style="font-weight:600; margin-bottom:4px;">leaf_underside_0149.jpg</div>
            <div style="font-size:0.85rem; color:var(--ink-soft);">Captured 6:47 AM · linked to observation #0148</div>
          </div>
        </div>
      </div>`
  },
  {
    role: "System",
    label: "Differential diagnosis narrows",
    title: "Confidence updated",
    note: "With the additional evidence, the model's confidence shifts meaningfully. The case still gets flagged for expert review because of downstream severity implications.",
    render: () => `
      <div class="mock">
        <h3>UPDATED AI ANALYSIS</h3>
        <div class="diag-row"><span>Early Blight (Alternaria solani)</span><span class="pct">84%</span></div>
        <div class="diag-row"><span>Septoria Leaf Spot</span><span class="pct">9%</span></div>
        <div class="diag-row"><span>Nutrient deficiency (Potassium)</span><span class="pct">7%</span></div>
        <div style="margin-top:14px;"><span class="badge low">Confidence: High</span> &nbsp; <span class="badge moderate">Severity: Medium–High</span></div>
        <div class="action-request">Case escalated to expert review — flowering-stage infection carries yield risk.</div>
      </div>`
  },
  {
    role: "Expert",
    label: "Expert confirms diagnosis & severity",
    title: "Expert verification",
    note: "An agronomist reviews both images, the differential diagnosis, and the farmer's field history, then confirms or adjusts the finding. This correction is recorded permanently.",
    render: () => `
      <div class="mock">
        <h3>EXPERT DASHBOARD — CASE #0148</h3>
        <div class="field-list">
          <div>Field<span>104 — Tomato, Pusa Ruby</span></div>
          <div>AI diagnosis<span>Early Blight, 84%</span></div>
          <div>Growth stage<span>Flowering</span></div>
          <div>Prior scans<span>3, last 21 days</span></div>
        </div>
        <div class="expert-note">
          <b>Dr. Meera Nair:</b> Confirmed — Early Blight. Severity adjusted to <b>High</b> given flowering stage and leaf-area coverage visible in image 2. Recommend monitoring + escalation to risk engine.
        </div>
      </div>`
  },
  {
    role: "System",
    label: "Field Health Passport updates",
    title: "Longitudinal record updated",
    note: "The confirmed case is appended to Field 104's persistent history. The system compares it against prior scans to establish a trend.",
    render: () => `
      <div class="mock">
        <h3>FIELD 104 — HEALTH PASSPORT</h3>
        <div class="diag-row"><span>Aug 16 — Routine scan</span><span class="pct">No issues</span></div>
        <div class="diag-row"><span>Aug 28 — Minor spotting noted</span><span class="pct">Low severity</span></div>
        <div class="diag-row"><span>Sep 06 — Early Blight, confirmed</span><span class="pct">High severity</span></div>
        <div style="margin-top:14px;"><span class="badge high">Trend: Worsening</span></div>
      </div>`
  },
  {
    role: "System",
    label: "Risk engine calculates field risk",
    title: "Explainable risk assessment",
    note: "Confirmed diagnosis, severity, growth stage, live weather forecast, soil condition, variety susceptibility, and pest-trap sensor readings combine into a single risk score with a visible breakdown — not a black box.",
    render: () => `
      <div class="mock">
        <h3>RISK ASSESSMENT — FIELD 104</h3>
        <div class="risk-score"><span class="num">74</span><span>/ 100 — <span class="badge high">HIGH</span></span></div>
        <ul class="factor-list">
          <li><span>Confirmed severity: High</span><span class="weight">+25</span></li>
          <li><span>Vulnerable growth stage (flowering)</span><span class="weight">+15</span></li>
          <li><span>Elevated humidity forecast, 78%</span><span class="weight">+10</span></li>
          <li><span>Variety 'Pusa Ruby' increases susceptibility</span><span class="weight">+6</span></li>
          <li><span>High soil moisture (74%)</span><span class="weight">+8</span></li>
          <li><span>Pest trap count high (12/trap)</span><span class="weight">+10</span></li>
        </ul>
        <div class="footnote">Weather factor calls a live forecast API (Open-Meteo) and only falls back to a labeled seasonal estimate if unreachable — it never silently fakes a live number.</div>
      </div>`
  },
  {
    role: "Officer",
    label: "Geospatial hotspot map",
    title: "Fields plotted by location and risk",
    note: "Alongside the ranked list, the officer sees where every field actually is — clustering is visible at a glance, not just implied by a distance figure in a list.",
    render: () => `
      <div class="mock">
        <h3>OFFICER MAP VIEW — REGION OVERVIEW</h3>
        <svg viewBox="0 0 400 220" style="width:100%; height:auto; background:#EEF0E6; border-radius:6px;">
          <circle cx="120" cy="90" r="14" fill="#B5432D" stroke="#7A2A1B" stroke-width="2"/>
          <text x="120" y="120" font-size="11" text-anchor="middle" fill="#1E2420" font-family="IBM Plex Mono">Field 104 — HIGH</text>
          <circle cx="160" cy="70" r="9" fill="#C9C4B2" stroke="#9A9484" stroke-width="1.5"/>
          <text x="160" y="55" font-size="10" text-anchor="middle" fill="#54605A" font-family="IBM Plex Mono">Field 218</text>
          <circle cx="130" cy="100" r="9" fill="#C9C4B2" stroke="#9A9484" stroke-width="1.5"/>
          <text x="90" y="105" font-size="10" text-anchor="middle" fill="#54605A" font-family="IBM Plex Mono">Field 301</text>
          <circle cx="300" cy="150" r="9" fill="#C9C4B2" stroke="#9A9484" stroke-width="1.5"/>
          <text x="300" y="175" font-size="10" text-anchor="middle" fill="#54605A" font-family="IBM Plex Mono">Field 077</text>
        </svg>
        <div class="footnote">Grey = not yet assessed this cycle. Coordinates and risk levels come from a real endpoint (haversine-based); this map rendering is the only piece left to build.</div>
      </div>`
  },
  {
    role: "Expert",
    label: "Guidance available in Hindi",
    title: "Multilingual advisory",
    note: "The same safe-next-steps guidance is available in Hindi — hand-translated, not machine-placeholder text — so language isn't a barrier to acting on the advice.",
    render: () => `
      <div class="mock">
        <h3>KNOWLEDGE BASE — EARLY BLIGHT (lang=hi)</h3>
        <div class="chat-bubble cure" style="font-size:0.95rem; line-height:1.8;">
          संक्रमित पत्तियों को हटाकर खेत से दूर नष्ट करें<br>
          खेत में जल निकासी और हवा का आवागमन बेहतर करें<br>
          कोई भी फफूंदनाशक डालने से पहले अपने कृषि विज्ञान केंद्र या कृषि अधिकारी से सलाह लें
        </div>
        <div class="footnote">Same endpoint, same knowledge base — just pass ?lang=hi. Pattern is ready to extend to more languages.</div>
      </div>`
  },
  {
    role: "Expert",
    label: "Case referred to lab",
    title: "Tracked lab / extension referral",
    note: "For cases needing confirmation beyond visual review, the expert creates a tracked referral — not just advisory text telling the farmer to 'consult someone.'",
    render: () => `
      <div class="mock">
        <h3>LAB REFERRAL — FIELD 104</h3>
        <div class="diag-row"><span>Reason</span><span class="pct">Confirm fungicide resistance</span></div>
        <div class="diag-row"><span>Referred by</span><span class="pct">Dr. Meera Nair</span></div>
        <div class="diag-row"><span>Status</span><span class="badge moderate">PENDING</span></div>
        <div class="footnote">Stays pending until the lab or extension office marks it completed — a real tracked entity, not a string.</div>
      </div>`
  },
  {
    role: "System",
    label: "Nearby farmers get alerted & advised",
    title: "Farmer-to-farmer alert & communication",
    note: "The confirmed case automatically notifies nearby farmers with what was found and what to do about it — no one has to ask. If a farmer is offline, the alert queues and relays phone-to-phone over Bluetooth mesh (BitChat-inspired store-and-forward) until it reaches them.",
    render: () => `
      <div class="mock">
        <h3>REGIONAL ALERT — TRIGGERED BY CASE #0148</h3>
        <div class="chat-msg">
          <div class="chat-head">
            <span class="chat-farmer">Sunita Devi — Field 218 (0.5 km away)</span>
            <span class="delivery-badge online">● Delivered directly — online</span>
          </div>
          <div class="chat-bubble">
            A confirmed case of <b>Early Blight</b> was found 0.5 km from your field.
          </div>
          <div class="chat-bubble cure">
            <b>What to do:</b> Remove visibly infected leaves and dispose away from the field · Improve field drainage and airflow · Consult your local Krishi Vigyan Kendra or agriculture officer before applying any fungicide
          </div>
        </div>
        <div class="chat-msg">
          <div class="chat-head">
            <span class="chat-farmer">Lakshmi Bai — Field 301 (0.1 km away)</span>
            <span class="delivery-badge mesh">◌ Relayed via BLE mesh — 2 hops, farmer offline</span>
          </div>
          <div class="chat-bubble">
            A confirmed case of <b>Early Blight</b> was found 0.1 km from your field.
          </div>
          <div class="chat-bubble cure">
            <b>What to do:</b> Remove visibly infected leaves and dispose away from the field · Improve field drainage and airflow · Consult your local Krishi Vigyan Kendra or agriculture officer before applying any fungicide
          </div>
          <div class="mesh-path">📱 Lakshmi's phone (offline) ⟶ 📱 neighbor's phone (relay) ⟶ 📶 village Wi-Fi node ⟶ ☁ synced to server</div>
        </div>
        <div class="footnote">Both farmers received the same plain-language cure information — not just "a case was found nearby," but what to actually do about it.</div>
      </div>`
  },
  {
    role: "Officer",
    label: "Officer dashboard ranks field highly",
    title: "Ranked inspection queue",
    note: "The officer doesn't see a map first — they see a ranked list of exactly where to go today, and why, ordered by what actually needs attention.",
    render: () => `
      <div class="mock">
        <h3>OFFICER DASHBOARD — TODAY'S INSPECTION QUEUE</h3>
        <div class="queue-item top">
          <div><div class="field-name">Priority 1 — Field 104</div><div class="reasons">Worsening trend · flowering stage · cluster proximity · no recent follow-up</div></div>
          <div class="score">91</div>
        </div>
        <div class="queue-item">
          <div><div class="field-name">Priority 2 — Field 218</div><div class="reasons">High severity · repeated symptoms</div></div>
          <div class="score">84</div>
        </div>
        <div class="queue-item">
          <div><div class="field-name">Priority 3 — Field 077</div><div class="reasons">Moderate severity · isolated case</div></div>
          <div class="score">58</div>
        </div>
      </div>`
  },
  {
    role: "System",
    label: "Intervention recorded, follow-up scheduled",
    title: "Action logged",
    note: "The officer's visit and recommended action are logged against the field, and a follow-up is scheduled automatically rather than left to memory.",
    render: () => `
      <div class="mock">
        <h3>INTERVENTION LOG — FIELD 104</h3>
        <div class="diag-row"><span>Problem</span><span class="pct">Early Blight, confirmed</span></div>
        <div class="diag-row"><span>Action taken</span><span class="pct">Extension officer visit + guidance issued</span></div>
        <div class="diag-row"><span>Follow-up scheduled</span><span class="pct">In 3 days</span></div>
      </div>`
  },
  {
    role: "Farmer",
    label: "Farmer submits follow-up scan",
    title: "Outcome comparison",
    note: "Three days later, the farmer scans again. The system compares severity before and after — using careful, non-causal language.",
    render: () => `
      <div class="mock">
        <h3>FOLLOW-UP COMPARISON — FIELD 104</h3>
        <div class="compare-cols">
          <div class="compare-col before"><h4>BEFORE</h4><div class="val">62%</div><div style="font-size:0.8rem;color:var(--ink-soft);">severity</div></div>
          <div class="compare-col improve"><h4>AFTER (Day 3)</h4><div class="val">38%</div><div style="font-size:0.8rem;color:var(--ink-soft);">severity</div></div>
        </div>
        <p style="font-size:0.88rem; margin-top:14px; color:var(--ink-soft);">Observed improvement following the recorded intervention.</p>
        <div class="footnote">Not stated as: "the intervention caused the improvement" — evidence doesn't yet support that causal claim.</div>
      </div>`
  },
  {
    role: "System",
    label: "Verified case joins the learning loop",
    title: "AI–Expert agreement recorded",
    note: "The full case — AI prediction, expert correction, outcome — becomes structured data for model evaluation and calibration.",
    render: () => `
      <div class="mock">
        <h3>LEARNING LOOP — CASE #0148 ARCHIVED</h3>
        <div class="diag-row"><span>AI initial confidence</span><span class="pct">52% → 84%</span></div>
        <div class="diag-row"><span>Expert agreement</span><span class="pct">Confirmed, severity adjusted</span></div>
        <div class="diag-row"><span>Outcome</span><span class="pct">Improved (Day 3 follow-up)</span></div>
        <div style="margin-top:14px;"><span class="badge low">Feeds AI–Expert Agreement Rate metric</span></div>
      </div>`
  }
];

let current = 0;

function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = stages.map((s,i) => `
    <button class="step-btn ${i===current?'active':''}" onclick="goTo(${i})">
      <span class="step-num">${i+1}</span>
      <span>
        <span class="step-label">${s.label}</span>
        <span class="step-role">${s.role.toUpperCase()}</span>
      </span>
    </button>
  `).join('');
}

function renderStage(){
  const s = stages[current];
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="stage-head">
      <h2>${s.title}</h2>
      <span class="role-chip role-${s.role}">${s.role}</span>
    </div>
    <p class="stage-note">${s.note}</p>
    ${s.render()}
    <div class="nav-buttons">
      <button class="nav-btn secondary" onclick="prevStage()" ${current===0?'disabled':''}>← Previous</button>
      <button class="nav-btn" onclick="nextStage()" ${current===stages.length-1?'disabled':''}>${current===stages.length-1?'End of story':'Next →'}</button>
    </div>
  `;
}

function goTo(i){ current = i; renderRail(); renderStage(); }
function nextStage(){ if(current < stages.length-1){ current++; renderRail(); renderStage(); } }
function prevStage(){ if(current > 0){ current--; renderRail(); renderStage(); } }

renderRail();
renderStage();
</script>
</body>
</html>
